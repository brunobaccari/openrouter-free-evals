name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos versionados
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            printf 'Arquivos ignorados versionados:\n%s\n' "$tracked"
            exit 1
          fi
      - run: cp .env.example .env
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Testes unitários do avaliador
        id: tests
        run: python -m pytest -q --junitxml=results/junit.xml
      - name: Avaliar respostas manuais
        id: fixtures
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python evaluate.py
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: results
          path: results/
          retention-days: 30
          if-no-files-found: warn
      - name: Resumo do avaliador e corpus manual
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EVALUATION_OUTCOME: ${{ steps.fixtures.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python ci_summary.py fixtures
