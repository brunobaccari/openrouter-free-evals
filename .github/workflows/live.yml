name: OpenRouter live
on:
  workflow_dispatch:
    inputs:
      model:
        description: Modelo com sufixo free e preço zero no catálogo
        required: true
        default: apodex/apodex-1.1-mini:free
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: cp .env.example .env
      - name: Conferir credencial
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"
      - name: Avaliar API hospedada
        id: evaluate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: python live_openrouter.py --model "$MODEL"
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: live-evaluation
          path: results/live.json
          retention-days: 30
          if-no-files-found: warn
      - name: Resumo da avaliação live
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python ci_summary.py live
